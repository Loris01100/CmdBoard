[cmd.launch]
usage = "launch <app>"
summary = "Inicia um app"

[cmd.add]
usage = "add [<nome> <destino> [categoria]]"
summary = "Adiciona um app (exe ou URI). Sem argumentos: abre o formulário"

[cmd.move]
usage = "move <app> [categoria]"
summary = "Move um app. Sem categoria: abre o formulário"

[cmd.edit]
usage = "edit <app>"
summary = "Abre o formulário para alterar nome, destino, categoria ou processo de um app; o histórico é mantido"

[cmd.rm]
usage = "rm <app>"
summary = "Remove um app e seu histórico, após confirmação"

[cmd.clear]
usage = "clear sessions|stats"
summary = "Apaga o histórico de sessões, ou todas as estatísticas, após confirmação"

[cmd.rmcat]
usage = "rmcat <categoria>"
summary = "Remove uma categoria vazia, após confirmação"

[cmd.stats]
usage = "stats [app]"
summary = "Estatísticas de todos os apps, ou de um"

[cmd.theme]
usage = "theme [nome]"
summary = "Troca o tema (salvo). Sem nome: lista os temas"

[cmd.sort]
usage = "sort [name|xp|recent|time]"
summary = "Ordena os apps (salvo). Sem argumentos: ordem atual"

[cmd.lang]
usage = "lang [en|fr|pt]"
summary = "Troca o idioma (salvo). Sem argumentos: lista os idiomas"

[cmd.group]
usage = "group <nome> <app>, <app>…"
summary = "Cria (ou substitui) um alias :<nome> que inicia esses apps"

[cmd.export]
usage = "export [arquivo]"
summary = 'Salva apps e sessões em JSON (padrão: Documents\cmdboard-<data>.json)'

[cmd.import]
usage = "import <arquivo>"
summary = "Mescla uma exportação: adiciona os apps e sessões ausentes, não exclui nada"

[cmd.uninstall]
usage = "uninstall <programa>"
summary = "Inicia o desinstalador de um programa, após confirmação (tela Armazenamento)"

[cmd.update]
usage = "update"
summary = "Instala a versão mais recente (MSI/winget: winget upgrade CmdBoard)"

[cmd.help]
usage = "help [comando]"
summary = "Mostra a ajuda, ou o uso de um comando"

[cmd.quit]
usage = "quit"
summary = "Sai do CmdBoard"

