[cmd.launch]
usage = "launch <app>"
summary = "Launches an app"

[cmd.add]
usage = "add [<name> <target> [category]]"
summary = "Adds an app (exe or URI). Without arguments: opens the form"

[cmd.move]
usage = "move <app> [category]"
summary = "Moves an app. Without a category: opens the form"

[cmd.rm]
usage = "rm <app>"
summary = "Removes an app and its history, after confirmation"

[cmd.rmcat]
usage = "rmcat <category>"
summary = "Removes an empty category, after confirmation"

[cmd.stats]
usage = "stats [app]"
summary = "Statistics of every app, or of one"

[cmd.theme]
usage = "theme [name]"
summary = "Switches theme (saved). Without a name: lists the themes"

[cmd.sort]
usage = "sort [name|xp|recent|time]"
summary = "Orders the apps (saved). Without arguments: current order"

[cmd.lang]
usage = "lang [en|fr]"
summary = "Switches language (saved). Without arguments: lists the languages"

[cmd.xp]
usage = "xp <app> <amount>"
summary = "Adds (or removes, if negative) XP to an app"

[cmd.update]
usage = "update"
summary = "Installs the latest version (MSI/winget: winget upgrade CmdBoard)"

[cmd.help]
usage = "help [command]"
summary = "Shows the help, or a command's usage"

[cmd.quit]
usage = "quit"
summary = "Quits CmdBoard"

