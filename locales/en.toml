[cmd.launch]
usage = "launch <app>"
summary = "Launches an app"

[cmd.add]
usage = "add [<name> <target> [category]]"
summary = "Adds an app (exe or URI). Without arguments: opens the form"

[cmd.move]
usage = "move <app> [category]"
summary = "Moves an app. Without a category: opens the form"

[cmd.edit]
usage = "edit <app>"
summary = "Opens the form to change an app's name, target, category or process; its history is kept"

[cmd.rm]
usage = "rm <app>"
summary = "Removes an app and its history, after confirmation"

[cmd.clear]
usage = "clear sessions|stats"
summary = "Clears the session history, or all stats, after confirmation"

[cmd.rmcat]
usage = "rmcat <category>"
summary = "Removes an empty category, after confirmation"

[cmd.stats]
usage = "stats [app]"
summary = "Statistics of every app, or of one"

[cmd.theme]
usage = "theme [name]"
summary = "Switches theme (saved). Without a name: lists the themes"

[cmd.goal]
usage = "goal [<duration>/day|week|off] [app|category]"
summary = "Play time to reach per day or week, for an app, a category or (without one) all apps; off removes it. Without arguments: lists them"

[cmd.limit]
usage = "limit [<duration>/day|week|off] [app|category]"
summary = "Play time not to exceed per day or week (warning and popup); same syntax as goal"

[cmd.sort]
usage = "sort [name|xp|recent|time]"
summary = "Orders the apps (saved). Without arguments: current order"

[cmd.lang]
usage = "lang [en|fr|pt]"
summary = "Switches language (saved). Without arguments: lists the languages"

[cmd.group]
usage = "group <name> <app>, <app>…"
summary = "Creates (or replaces) an alias :<name> that launches these apps"

[cmd.export]
usage = "export [file]"
summary = 'Saves apps and sessions to JSON (default: Documents\cmdboard-<date>.json)'

[cmd.import]
usage = "import <file>"
summary = "Merges an export: adds the missing apps and sessions, deletes nothing"

[cmd.uninstall]
usage = "uninstall <program>"
summary = "Starts a program's uninstaller, after confirmation (Storage screen)"

[cmd.update]
usage = "update"
summary = "Installs the latest version (MSI/winget: winget upgrade CmdBoard)"

[cmd.help]
usage = "help [command]"
summary = "Shows the help, or a command's usage"

[cmd.quit]
usage = "quit"
summary = "Quits CmdBoard"

