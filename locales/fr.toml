[cmd.launch]
usage = "launch <app>"
summary = "Lance une app"

[cmd.add]
usage = "add [<nom> <cible> [catégorie]]"
summary = "Ajoute une app (exe ou URI). Sans argument : ouvre le formulaire"

[cmd.move]
usage = "move <app> [catégorie]"
summary = "Déplace une app. Sans catégorie : ouvre le formulaire"

[cmd.edit]
usage = "edit <app>"
summary = "Ouvre le formulaire pour changer le nom, la cible, la catégorie ou le process d'une app ; son historique est conservé"

[cmd.rm]
usage = "rm <app>"
summary = "Supprime une app et son historique, après confirmation"

[cmd.clear]
usage = "clear sessions|stats"
summary = "Efface l'historique des sessions, ou toutes les stats, après confirmation"

[cmd.rmcat]
usage = "rmcat <catégorie>"
summary = "Supprime une catégorie vide, après confirmation"

[cmd.stats]
usage = "stats [app]"
summary = "Statistiques de toutes les apps, ou d'une seule"

[cmd.theme]
usage = "theme [nom]"
summary = "Change de thème (mémorisé). Sans nom : liste les thèmes"

[cmd.sort]
usage = "sort [name|xp|recent|time]"
summary = "Trie les apps (mémorisé). Sans argument : tri actuel"

[cmd.lang]
usage = "lang [en|fr|pt]"
summary = "Change de langue (mémorisée). Sans argument : liste les langues"

[cmd.group]
usage = "group <nom> <app>, <app>…"
summary = "Crée (ou remplace) un alias :<nom> qui lance ces apps"

[cmd.export]
usage = "export [fichier]"
summary = 'Sauvegarde apps et sessions en JSON (par défaut : Documents\cmdboard-<date>.json)'

[cmd.import]
usage = "import <fichier>"
summary = "Fusionne un export : ajoute les apps et sessions manquantes, ne supprime rien"

[cmd.uninstall]
usage = "uninstall <programme>"
summary = "Lance le désinstalleur d'un programme, après confirmation (écran Stockage)"

[cmd.update]
usage = "update"
summary = "Installe la dernière version (MSI/winget : winget upgrade CmdBoard)"

[cmd.help]
usage = "help [commande]"
summary = "Affiche l'aide, ou l'usage d'une commande"

[cmd.quit]
usage = "quit"
summary = "Quitte CmdBoard"

