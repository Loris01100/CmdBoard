# Official palette: https://catppuccin.com/palette
name = "Catppuccin Mocha"

[palette]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[slots]
border             = "overlay0"
border_focused     = "sapphire"
title              = { fg = "mauve", bold = true }
selected           = { fg = "base", bg = "mauve", bold = true }
selected_unfocused = { bg = "surface0", bold = true }
xp_fill            = "green"
info               = "sky"
success            = "green"
warning            = "yellow"
caution            = "peach"
error              = "red"
muted              = "overlay1"
