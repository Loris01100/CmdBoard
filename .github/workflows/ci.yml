name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar's blame / new-code detection
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-machete,cargo-deny,cargo-llvm-cov,cargo-sonar-scanner
      # Dependencies declared in Cargo.toml but never used.
      - run: cargo machete
      # Vulnerabilities, licenses and sources of dependencies (deny.toml).
      - run: cargo deny check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs the test suite and writes the coverage report read by Sonar.
      - run: cargo llvm-cov --lcov --output-path target/lcov.info
      # Skipped when the secret is unavailable (forks).
      - if: env.SONAR_TOKEN != ''
        run: cargo sonar-scanner
