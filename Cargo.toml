[package]
name = "cmdboard"
version = "0.1.0"
edition = "2024"
description = "Terminal dashboard to launch apps and track play time, with XP and rewards"
repository = "https://github.com/Loris01100/CmdBoard"
authors = ["Loris01100"]

[package.metadata.wix]
upgrade-guid = "94256D30-D74C-400B-8D07-B858839C666B"
path-guid = "B90453B5-11E9-4F80-A6FE-22518863279D"
license = false
eula = false

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
fuzzy-matcher = "0.3.7"
lnk = "0.6.4"
opener = "0.9.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
self_update = { version = "1.3.0", default-features = false, features = ["archive-zip", "compression-zip-deflate", "github", "rustls", "ureq"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
toml = "1.1.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
