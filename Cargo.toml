[package]
name = "cmdboard"
version = "0.2.0"
edition = "2024"
description = "Terminal dashboard to launch apps and track play time, with XP and rewards"
repository = "https://github.com/Loris01100/CmdBoard"
authors = ["Loris01100"]
license = "MIT"

[package.metadata.wix]
upgrade-guid = "94256D30-D74C-400B-8D07-B858839C666B"
path-guid = "B90453B5-11E9-4F80-A6FE-22518863279D"
license = false
eula = false

[package.metadata.sonar]
project-key = "Loris01100_CmdBoard"
organization = "loris01100"
exclusions = ["target/**"]
"rust.lcov.reportPaths" = "target/lcov.info"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
fuzzy-matcher = "0.3.7"
lnk = "0.6.4"
opener = "0.9.0"
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
self_update = { version = "1.3.0", default-features = false, features = ["archive-zip", "compression-zip-deflate", "github", "rustls", "ureq"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.6"
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
# panic stays "unwind": a panic in a temporary scan thread must not kill the UI.

[lints.clippy]
# Pedantic lints warn, so CI (-D warnings) rejects them. The group includes
# too_many_lines: functions over `too-many-lines-threshold` (clippy.toml) fail CI; see AGENTS.md.
pedantic = { level = "warn", priority = -1 }
# Seconds, bytes and counts stay far below 2^52: f64 holds them exactly enough for ratios and charts.
cast_precision_loss = "allow"
# `assert!(x.is_empty())` reads better than comparing with a typed empty array.
assert_is_empty = "allow"
